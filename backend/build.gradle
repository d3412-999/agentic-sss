plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.spring_web'
version = '0.1.0'
description = '课程设计智能答辩与评分系统 - 后端服务'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    // 国内网络可把镜像放到 mavenCentral() 之前
    // maven { url = uri('https://maven.aliyun.com/repository/public') }
    mavenCentral()
}

ext {
    // 与 application.yaml 的 spring.flyway 版本保持一致
    set('flyway.version', '10.22.0')
    // 1.18.46 同时支持 JDK 17 ~ 25 的注解处理
    set('lombok.version', '1.18.46')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 持久层
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.18.1'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 接口文档
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // JWT（jjwt 0.12.x）
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // 报告正文抽取：PDF 用 PDFBox，DOCX 用 Apache POI
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'

    // Lombok：编译期注解处理
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 显式按 17 发布，保证用高版本 JDK 编译也产出 17 字节码
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'user.timezone', 'Asia/Shanghai'
}
