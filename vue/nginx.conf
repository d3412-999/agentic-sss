# 前端容器内的 Nginx：托管 SPA + 把 /api 反代到后端容器
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单文件上传上限：后端业务上限 300MB（录像），这里留出 multipart 余量
    client_max_body_size 340m;

    # SPA 路由（history 模式）回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反代：backend 是 compose 里的服务名
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 评审、导出、录像上传都偏慢，读超时给足
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # 后端健康检查与 Swagger（可选，方便演示）
    location /actuator/ { proxy_pass http://backend:8081; }
    location /swagger-ui/ { proxy_pass http://backend:8081; }
    location /v3/api-docs { proxy_pass http://backend:8081; }

    # 静态资源缓存
    location ~* \.(js|css|svg|png|jpg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
