# agentic-sss HTTPS 入口（自签名证书，摄像头/麦克风需要安全上下文）
#
# 正式部署建议换成受信任证书（域名 + Let's Encrypt / 云厂商证书）。
# 当前自签名证书首次访问会有浏览器警告，点「继续访问」后页面为 HTTPS 安全上下文。
#
# 证书生成（在服务器执行）：
#   mkdir -p /usr/local/nginx/conf/ssl
#   openssl req -x509 -nodes -newkey rsa:2048 -days 825 \
#     -keyout /usr/local/nginx/conf/ssl/agentic-sss.key \
#     -out /usr/local/nginx/conf/ssl/agentic-sss.crt \
#     -subj "/CN=sss.101.200.131.222.nip.io" \
#     -addext "subjectAltName=DNS:sss.101.200.131.222.nip.io,DNS:sss.101.200.131.222.sslip.io,IP:101.200.131.222"
server {
    listen 443 ssl;
    server_name sss.101.200.131.222.nip.io sss.101.200.131.222.sslip.io;

    ssl_certificate     /usr/local/nginx/conf/ssl/agentic-sss.crt;
    ssl_certificate_key /usr/local/nginx/conf/ssl/agentic-sss.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AGENTIC_SSS_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 340m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
