# agentic-sss 宿主机 Nginx 反向代理配置
#
# 适用场景：服务器 80 端口已被其它站点占用，且安全组只开放 80/443。
# 通过 nip.io / sslip.io 泛解析域名 + Host 精确匹配，把本项目的 80 请求
# 转发到只监听 127.0.0.1:18080 的前端容器，不影响原来按 IP 访问的站点。
#
# 部署：
#   1) 把本文件放到宿主机 Nginx 的 conf.d 目录；
#   2) 确保 nginx.conf 的 http {} 内有 include <conf.d>/*.conf;
#   3) nginx -t && nginx -s reload
#
# 注意：把 101.200.131.222 换成你的公网 IP；也可以给 servers 配自己的域名。

server {
    listen 80;
    server_name sss.101.200.131.222.nip.io sss.101.200.131.222.sslip.io;

    client_max_body_size 340m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
