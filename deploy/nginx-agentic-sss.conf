# agentic-sss 宿主机 Nginx 反向代理配置
#
# 适用场景：服务器 80 端口已被其它站点占用，且安全组只开放 80/443。
# 通过 nip.io / sslip.io 泛解析域名 + Host 精确匹配，把本项目的请求
# 转发到只监听 127.0.0.1:18080 的前端容器，不影响原来按 IP 访问的站点。
#
# 这里 80 端口只做 HTTPS 跳转：摄像头/麦克风只能在安全上下文使用，
# 统一走 443（自签名证书见 nginx-agentic-sss-ssl.conf）。
server {
    listen 80;
    server_name sss.101.200.131.222.nip.io sss.101.200.131.222.sslip.io;

    # 强制 HTTPS：避免学生用 HTTP 打开答辩页导致浏览器禁用摄像头
    location / {
        return 301 https://$host$request_uri;
    }
}
