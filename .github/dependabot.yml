version: 2

updates:
  # 后端：Gradle 依赖与 Spring Boot 插件
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 前端：Vue / Vite 及 @vitejs/plugin-vue
  - package-ecosystem: npm
    directory: /vue
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # AI 服务：FastAPI / uvicorn / pydantic-settings 等
  - package-ecosystem: pip
    directory: /langchain_service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      ai-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # CI：actions/checkout、setup-java 等
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
