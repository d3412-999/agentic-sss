name: 功能建议
description: 提议新功能、体验改进或架构调整
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 README 的「已知限制」与 CHANGELOG 的「计划中」，避免和路线图重复。

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 后端 backend（Spring Boot）
        - 前端 vue（Vue 3 + Vite）
        - AI 服务 langchain_service（FastAPI）
        - 构建 / CI / 脚本
        - 文档
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与痛点，而不是直接给出实现方案。
      placeholder: 教师在批改时……目前只能……，导致……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？如果有替代方案也一并说明。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响面自查
      options:
        - label: 涉及数据库表结构变更（需要新增 Flyway 迁移）
        - label: 涉及接口变更（需要同步前端 `vue/src/api/endpoints.js`）
        - label: 涉及新依赖（请说明为何不能用现有技术栈实现）
