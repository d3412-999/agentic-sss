name: Bug 报告
description: 报告一个可以复现的缺陷（构建失败、接口报错、页面异常等）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认你已经读过 README 的「常见问题」一节，并搜索过现有 Issue。
        > 安全漏洞请不要开公开 Issue，请按 [SECURITY.md](https://github.com/OWNER/REPO/blob/main/SECURITY.md) 私下报告。

  - type: dropdown
    id: module
    attributes:
      label: 影响模块
      options:
        - 后端 backend（Spring Boot）
        - 前端 vue（Vue 3 + Vite）
        - AI 服务 langchain_service（FastAPI）
        - 构建 / CI / 脚本
        - 文档
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 你期望发生什么，实际发生了什么？
      placeholder: 期望……实际……
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 越具体越好，包含调用的接口、页面路径、输入数据。
      placeholder: |
        1. docker compose up -d
        2. cd backend && ./gradlew bootRun
        3. 登录 T2019008 / 123456
        4. 打开 /offerings/1 → 「发布教学班」
        5. 报错 500，traceId=xxxx
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 后端堆栈、浏览器控制台、`X-Trace-Id` 响应头等。请先抹掉密钥与个人信息。
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 版本或提交号
      description: 例如 `main@c035132` 或 Release 标签
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境
      value: |
        - OS:
        - JDK:
        - Node / npm:
        - Python:
        - MySQL / Redis 版本与启动方式（Docker / 本机）:
      render: markdown
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复报告
          required: true
        - label: 我已确认日志里没有包含真实密钥或他人隐私数据
          required: true
